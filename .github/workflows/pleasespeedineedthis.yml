name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which build to run: debug, release, or all'
        required: true
        default: 'debug'
        type: string
      module:
        description: 'Android module to build (default: app)'
        required: false
        default: 'app'
        type: string
      api_level:
        description: 'Android SDK API level for runner'
        required: false
        default: '33'
        type: string
      build_variant:
        description: 'Release variant name (default: release)'
        required: false
        default: 'release'
        type: string
      skip_sign:
        description: 'If true, skip signing the release build (useful for unsigned release APK)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
      MODULE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.module || 'app' }}
      API_LEVEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.api_level || '33' }}
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant || 'release' }}
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'debug' }}
      SKIP_SIGN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_sign || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Cache Gradle directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}

      - name: Install Android SDK (tools + platform)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: default
          arch: x86_64
          force-avd-creation: false

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      # Optional: decode keystore from secrets and create gradle.properties for signing
      - name: Decode keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p $HOME/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/.android/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write signing properties for Gradle (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          # Append signing properties to gradle.properties at the repo root.
          # Your app's build.gradle must reference these properties.
          cat >> $GITHUB_WORKSPACE/gradle.properties <<EOF

# --- Added by CI for signing ---
RELEASE_KEYSTORE=$HOME/.android/release.keystore
RELEASE_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
EOF

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' }}
        run: |
          ./gradlew clean :$MODULE:assembleDebug --no-daemon

      - name: Build release APK (if signing secrets present)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all') && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_sign == 'false') }}
        run: |
          ./gradlew :$MODULE:assemble${{ env.BUILD_VARIANT | title }} --no-daemon

      - name: List APKs produced
        run: |
          echo "APKs in $MODULE/build/outputs:"
          find $MODULE/build/outputs -type f -name "*.apk" -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            ${{ env.MODULE }}/build/outputs/**/*.apk
